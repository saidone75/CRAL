name: Clojure CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: 1.12.6.1673

      - name: Download deps
        run: clojure -P -M:test

      - name: Download build deps
        run: clojure -P -T:build

      - name: Unit tests
        run: clojure -M:test -n cral.utils-test

      - name: Build library JAR
        run: clojure -T:build jar
